<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:885px;height:593px;background:#FFFFFF;" width="885px" height="593px" viewBox="0 0 885 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="5"><text x="123.892" y="22.995" fill="#000" font-size="14" textLength="631.121" font-weight="700" font-family="Segoe UI">CloudSec pipeline:  screen -> harden -> simulate -> score -> dashboard -> gate</text></g><!--entity S1--><g class="entity" data-qualified-name="S1" id="ent0001" data-source-line="18"><rect x="106.02" y="44.297" width="523.374" height="59.578" fill="#E9EFF8" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="276.678" y="66.364" fill="#000" font-size="13" textLength="182.057" font-weight="700" font-family="Segoe UI">01   PROMPT SCREENING</text><text x="116.02" y="79.64" fill="#000" font-size="11" textLength="503.374" font-family="Segoe UI">normalization  ·  input_validation  ·  rule_engine  ·  classifier_interface  ·  decision_combiner</text><text x="174.845" y="91.517" fill="#6B7482" font-size="10" textLength="385.723" font-family="Segoe UI">screening_service · schemas · explanation · session_store · fail-closed output</text></g><!--entity S2--><g class="entity" data-qualified-name="S2" id="ent0002" data-source-line="19"><rect x="155.52" y="136.877" width="424.385" height="59.578" fill="#E1F3EE" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="274.71" y="158.944" fill="#000" font-size="13" textLength="186.005" font-weight="700" font-family="Segoe UI">02   PROMPT HARDENING</text><text x="167.279" y="172.22" fill="#000" font-size="11" textLength="400.866" font-family="Segoe UI">task_analyzer  ·  scope_inspector  ·  control_selector  ·  prompt_hardener</text><text x="165.52" y="184.097" fill="#6B7482" font-size="10" textLength="404.385" font-family="Segoe UI">security_controls.yaml · policy.yaml · scope.yaml · provenance / integrity checks</text></g><!--entity S3--><g class="entity" data-qualified-name="S3" id="ent0003" data-source-line="20"><rect x="184.45" y="213.457" width="366.521" height="59.578" fill="#ECE7F7" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="276.158" y="235.524" fill="#000" font-size="13" textLength="183.104" font-weight="700" font-family="Segoe UI">03   ACTION SIMULATION</text><text x="194.45" y="248.8" fill="#000" font-size="11" textLength="346.521" font-family="Segoe UI">extractor  ·  planner  ·  enumerator  ·  graph_builder  ·  adapter</text><text x="198.316" y="260.677" fill="#6B7482" font-size="10" textLength="338.789" font-family="Segoe UI">output: proposed action graph + CloudTrail-style simulated records</text></g><!--entity S4--><g class="entity" data-qualified-name="S4" id="ent0004" data-source-line="21"><rect x="124.85" y="290.037" width="485.722" height="72.383" fill="#E9E5F6" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="299.296" y="312.104" fill="#000" font-size="13" textLength="136.83" font-weight="700" font-family="Segoe UI">04   RISK SCORING</text><text x="175.359" y="325.38" fill="#000" font-size="11" textLength="384.705" font-family="Segoe UI">feature_engine9  —  identity · IAM · resource-path · temporal features</text><text x="134.85" y="338.185" fill="#000" font-size="11" textLength="465.722" font-family="Segoe UI">HGT / graph branch (gnn_scorer)      +      LSTM-transformer branch (lstm_inference)</text><text x="188.058" y="350.061" fill="#6B7482" font-size="10" textLength="359.307" font-family="Segoe UI">fused risk + explanation:  pipeline.py · ensemble_explain.py · threshold</text></g><!--entity S5--><g class="entity" data-qualified-name="S5" id="ent0005" data-source-line="22"><rect x="155.49" y="379.417" width="424.443" height="59.578" fill="#FBEFD7" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="305.419" y="401.484" fill="#000" font-size="13" textLength="124.585" font-weight="700" font-family="Segoe UI">05   DASHBOARD</text><text x="165.49" y="414.76" fill="#000" font-size="11" textLength="404.443" font-family="Segoe UI">cloudsec_dashboard  ·  live event risk score  ·  blocked-event explanation</text><text x="181.1" y="426.637" fill="#6B7482" font-size="10" textLength="373.223" font-family="Segoe UI">live scoring + explanations for security analysts when an event is stopped</text></g><!--entity S6--><g class="entity" data-qualified-name="S6" id="ent0006" data-source-line="23"><rect x="171.75" y="455.997" width="391.927" height="59.578" fill="#E4E8EC" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="288.618" y="478.064" fill="#000" font-size="13" textLength="158.19" font-weight="700" font-family="Segoe UI">06   EXECUTION GATE</text><text x="181.75" y="491.34" fill="#000" font-size="11" textLength="371.927" font-family="Segoe UI">risk below threshold  +  all policy checks pass  +  action is in scope</text><text x="310.094" y="503.217" fill="#6B7482" font-size="10" textLength="115.239" font-family="Segoe UI">planned pre-flight gate</text></g><!--entity REJ--><g class="entity" data-qualified-name="REJ" id="ent0007" data-source-line="25"><rect x="761.52" y="50.707" width="110.386" height="46.773" fill="#FBE9E7" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="791.205" y="72.774" fill="#000" font-size="13" textLength="51.016" font-weight="700" font-family="Segoe UI">REJECT</text><text x="771.52" y="85.122" fill="#000" font-size="10" textLength="90.386" font-family="Segoe UI">malicious / review</text></g><!--entity BLK--><g class="entity" data-qualified-name="BLK" id="ent0008" data-source-line="26"><rect x="7" y="532.577" width="365.42" height="46.773" fill="#FBE9E7" style="stroke:#181818;stroke-width:1.4;" rx="6" ry="6"/><text x="94.029" y="554.644" fill="#000" font-size="13" textLength="191.363" font-