catalogue_id: cloudsec-prompt-hardening-controls
catalogue_version: 0.2.3
schema_version: '1'
updated_at: '2026-10-21'
scope_version: '1'
description: Catalogue for the bounded CloudSec security-hardening module. Twenty-four active external
  controls have dated local section-review records. These local records are not raw upstream snapshots
  and do not supply content_hash values for the external pages. The remaining draft control awaits exact
  NIST SSDF clause review. Automated raw-source synchronisation is implemented with opt-in activation
  and tested using mocked responses; live raw retrieval remains unrun.
changelog:
- version: 0.2.3
  date: '2026-10-21'
  change: Verified and corrected official source sections for secure error handling, context-aware output
    encoding, and dependency supply-chain checks; promoted those controls from draft after source review.
    Incomplete source syncs are prevented from activating.
- version: 0.2.2
  date: '2026-10-21'
  change: Clarified rate-limit and logging cue detection; preserved trust-policy review for IAM-role creation;
    tightened source-sync activation so incomplete syncs cannot replace the last-known-good catalogue.
- version: 0.2.1
  date: '2026-10-21'
  change: Scoped bucket controls to bucket-specific actions; clarified upload-surface detection and source
    provenance states.
- version: 0.2.0
  date: '2026-10-21'
  change: Reviewed 20 active external controls against cited official AWS/OWASP documentation; added dated
    SHA-256-hashed section-review records. Corrected deprecated OWASP/API references. Demoted LOG-AUDIT-001
    (its referenced parent pipeline file is absent from this export) and DEV-VERIFY-001 (exact NIST SSDF
    clauses not reverified) pending source review. Implemented explicit source_sync workflow separately;
    no live raw-source sync was run.
- version: 0.1.2
  date: '2026-10-19'
  change: requirement_cues.replacement_trail now recognises "after the new organization trail"-style wording,
    so retiring a trail with a named replacement is not reported as disabling audit logging.
- version: 0.1.1
  date: '2026-10-18'
  change: 'Applicability tuning after running the analyser over scenario prompts: IAM-ESCALATE-004 now
    needs an explicit PassRole / IAM-write shape; S3-PUBLIC-001 and S3-ENCRYPT-002 apply to creating or
    changing a bucket, not to granting access to an existing one; DB-ACCESS-001 needs an endpoint or untrusted
    input, so a plain schema migration is not flagged; IAM-LEASTPRIV-001 no longer treats EC2 network
    rules as IAM grants and its clause wording was made subject-neutral.'
- version: 0.1.0
  date: '2026-10-18'
  change: 'Initial catalogue: 25 controls (22 active, 3 draft awaiting source verification).'
freshness:
  last_sync_attempt: null
  last_sync_status: never_synced
  last_known_good_version: 0.2.3
  note: Dated local section-review records are stored under snapshots/section_evidence. These are not
    raw upstream response snapshots. Run python -m security_hardening.source_sync sync in a network-enabled
    environment to fetch raw official source bytes and create a candidate; activation is opt-in and blocked
    when any source is unavailable or expected section cues cannot be verified.
requirement_cues:
  least_privilege:
  - least[- ]privilege
  - principle of least
  - minimum (necessary |required )?(permissions?|access|privileges?)
  - only (the )?(permissions?|actions?|access|privileges?) (it |they |that )?(needs?|requires?|required|necessary)
  - narrowly[- ]scoped
  scoped_resources:
  - (scoped?|restricted?|limited?)( down)? to (only )?(the |that |this )?(specific|named|single|one|particular)
    (bucket|prefix|resource|table|role|path|key|arn|object|parameter)s?
  - resource[- ]level (permissions?|scoping|restriction)
  - only (on|for|to) (the )?(specific |named |single |particular )?(bucket|prefix|resource|path|arn)
  no_wildcards:
  - \bno wildcards?\b
  - (avoid|without|(do not|don[\x27’]?t|never) use)\s+(any\s+)?wildcards?
  - (avoid|without)\s+(a\s+)?(\*|star)\b
  restricted_trust:
  - trust (policy|relationship)[^.]{0,60}(only|restricted|limited|scoped|just)
  - only (the |this )?(specific |named )?(service|account|role|principal|user)s?[^.]{0,30}(can|may|is
    allowed to|are allowed to) assume
  - restrict(ed|s)?\s+(who|which)\s+(\w+\s+){0,2}assume
  - external[- ]?id
  - assumable (only )?by
  block_public_access:
  - block public access
  - (no|without)\s+public\s+(access|read|write|acl)
  - (not|never)\s+(be\s+)?(publicly|public)\b
  - private (bucket|only)
  - (must|should|stay|remain)\s+(stay |remain |be )?private
  - (disable|block|deny)\s+(all\s+)?public
  private_only_access:
  - private (subnet|endpoint|network|access|only)
  - not (exposed|reachable|accessible)\s+(to|from)\s+the\s+(public\s+)?internet
  - no (public|internet) (access|exposure|ingress)
  - internal[- ]only
  - vpc[- ]only
  encryption_at_rest:
  - encrypt(ed|ion)?\s+(at rest|the (bucket|data|objects?|volumes?|database))
  - server[- ]side encryption
  - \bSSE\b
  - encryption at rest
  - encrypted (bucket|volume|storage|database)
  encryption_in_transit:
  - in[- ]transit
  - \bTLS\b
  - https[- ]only
  - (enforce|require)\s+(https|ssl)
  - secure[- ]?transport
  versioning_or_backup:
  - \bversioning\b
  - \bback(up|ed up|s up)\b
  - object lock
  - point[- ]in[- ]time
  - snapshot (it )?before
  - retain (a )?(copy|backup)
  deletion_protection:
  - deletion protection
  - mfa delete
  - (confirm(ation)?|approval)\s+before\s+(deleting|delete|removing)
  - soft[- ]delete
  - require(s)?\s+(explicit\s+)?(confirmation|approval)
  audit_logging:
  - audit (log|trail|logging)
  - cloudtrail (logging )?(must |should |stays |remains )?(be )?(enabled|on|active)
  - keep (cloudtrail|logging) (on|enabled|active)
  - (access|server access) logging
  - log (all )?(access|changes|api calls)
  replacement_trail:
  - replacement trail
  - (after|once|before|when)\s+(the\s+)?(new|replacement|organization|org|equivalent)(\s+[\w-]+){0,2}\s+trail
  - equivalent trail
  - another trail (is|remains|already)
  temporary_credentials:
  - temporary credentials?
  - short[- ]lived (credentials?|tokens?)
  - (iam )?roles?\s+(instead of|rather than)\s+(long[- ]term |static )?(access )?keys?
  - instance profile
  - no (long[- ]term|static) (access )?keys?
  - \bfederat(ed|ion)\b
  mfa_required:
  - \bMFA\b
  - multi[- ]?factor
  - \b2FA\b
  - two[- ]factor
  no_hardcoded_secrets:
  - (no|never|not|without|avoid)\s+(\w+\s+){0,3}(hard[- ]?cod(e|ed|ing)|embed(ded|ding)?|commit(ted|ting)?)\s+(\w+\s+){0,3}(secrets?|credentials?|keys?|passwords?|tokens?)
  - (secrets?|credentials?|passwords?|keys?|tokens?)\s+(must |should )?(come|be (read|loaded|injected|retrieved|fetched))\s+(from|via|at
    runtime)
  - (read|load|retrieve|fetch|inject)\w*\s+(the\s+)?(secrets?|credentials?|passwords?|keys?|tokens?)\s+(from|via)\s+(the\s+)?(env|environment|secret|parameter|vault|store)
  - no secrets? in (code|source|the repo|git)
  - environment variables? for (secrets?|credentials?|passwords?)
  parameterized_queries:
  - parameteri[sz]ed (quer(y|ies)|statements?|sql)
  - prepared statements?
  - bind(ing)? (variables|parameters)
  - bound parameters?
  - query parameters? binding
  safe_command_execution:
  - (no|avoid|without|never)\s+(\w+\s+){0,2}(shell|os\.system|shell=true)
  - argument (list|array)
  - subprocess[^.]{0,30}list
  - \bshlex\b
  - allow[- ]?list(ed)? (of )?commands?
  input_validation:
  - validat(e|es|ed|ion|ing)\s+(\w+\s+){0,4}(input|parameters?|params?|fields?|requests?|payloads?|length|charset|types?|formats?|values?)
