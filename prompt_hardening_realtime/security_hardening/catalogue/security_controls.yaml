        - public_principal
    default_assumption: 'The bucket is private: no public read or write access was requested.'
    blocking: false
  conflict_triggers:
  - id: public-bucket-write-requested
    when:
      fact: requested_configurations
      any_of:
      - public_bucket_write
    why: Letting anyone write to a bucket enables abuse and data tampering.
    alternative: Let named principals upload through scoped credentials, or use time-limited upload permissions
      for specific objects.
  - id: public-access-block-disable-requested
    when:
      fact: requested_configurations
      any_of:
      - disable_public_access_block
    why: Turning off Block Public Access removes the safeguard against accidental public exposure.
    alternative: Keep Block Public Access on and grant access to specific principals; if public content
      is required, scope any exception to the exact prefix and review it.
  - id: public-read-of-sensitive-data-requested
    when:
      all:
      - fact: requested_configurations
        any_of:
        - public_bucket_access
      - fact: sensitive_data
        present: true
    why: The request makes a bucket publicly readable while the data it describes looks sensitive.
    alternative: Keep the data private and share it through scoped, time-limited access for the people
      who need it.
