controls:
- control_id: IAM-LEASTPRIV-001
  control_category: identity_and_permissions
  control_name: Least-privilege permissions
  control_description: Permissions granted to a principal should be limited to the specific actions and
    resources the workload needs, rather than broad access granted for convenience.
  enforcement: recommended
  applicability_conditions:
    any:
    - fact: permission_shapes
      any_of:
      - policy_authoring
      - passrole
      - iam_write
      - wildcard_action
      - wildcard_resource
      - admin_policy
    - all:
      - fact: action_classes
        any_of:
        - grant
        - create
        - modify
      - fact: resource_kinds
        any_of:
        - iam_role
        - iam_policy
        - iam_user
        - iam_group
        - access_key
    - all:
      - fact: action_classes
        any_of:
        - grant
      - fact: services
        any_of:
        - s3
        - ssm
        - cloudtrail
        - sts
  satisfied_by:
    fact: stated_requirements
    any_of:
    - least_privilege
    - scoped_resources
  affected_services_or_components:
  - iam
  - sts
  required_prompt_clause: Limit {subject} to only the specific actions on the specific resources this
    task needs (name the actions and resources; add conditions where they help). Do not use wildcard actions
    or resources, and do not remove any permission the requested functionality actually needs.
  verification_expectation: 'Inspect the resulting policy: no "*" in Action or Resource unless justified
    in writing, and every action maps to a stated need. Run policy validation or an access-analysis check
    if one is available and report its findings.'
  severity_or_priority: high
  source_name: AWS IAM User Guide — Security best practices
  source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  source_version_or_section: Apply least-privilege permissions
  retrieved_at: '2026-10-21T04:45:00Z'
  content_hash: null
  provenance_status: section_checked
  derived: false
  supporting_references: []
  catalogue_version: 0.1.1
  active_status: active
  source_status: available
- control_id: IAM-WILDCARD-002
  control_category: identity_and_permissions
  control_name: Avoid wildcard permissions and broad administrator policies
  control_description: Wildcard actions, wildcard resources and broad administrator-level managed policies
    should not be granted unless the broad access is justified, bounded and reviewed.
  enforcement: recommended
  applicability_conditions:
    any:
    - fact: permission_shapes
      any_of:
      - wildcard_action
      - wildcard_resource
      - admin_policy
    - fact: requested_configurations
      any_of:
      - attach_admin_policy
      - wildcard_permissions
  satisfied_by:
    fact: stated_requirements
    any_of:
    - no_wildcards
  affected_services_or_components:
  - iam
  required_prompt_clause: Avoid "*" actions, "*" resources and broad managed administrator policies for
    {subject}. If broader access is genuinely required, state why, limit its scope and duration, and flag
    it for review instead of applying it silently.
  verification_expectation: Search the produced policies and templates for "*" in Action/Resource and
    for administrator-level managed policy attachments; each hit must have a written justification or
    be removed.
  severity_or_priority: high
  conflict_triggers:
  - id: admin-or-wildcard-requested
    when:
      fact: requested_configurations
      any_of:
      - attach_admin_policy
      - wildcard_permissions
    why: The request asks for administrator-level or all-actions permissions, which conflicts with least-privilege
      guidance.
    alternative: Grant only the specific actions on the specific resources the task needs (the access
      the workload actually uses is the right starting point). If broad access is truly needed temporarily,
      make it time-bound, reviewed and logged.
  source_name: AWS IAM User Guide — Security best practices
  source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  source_version_or_section: Apply least-privilege permissions; avoid broad policies
  retrieved_at: '2026-10-21T04:45:00Z'
  content_hash: null
  provenance_status: section_checked
  derived: true
  supporting_references:
  - source_name: AWS IAM User Guide - Security best practices in IAM
    source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
    source_version_or_section: Use conditions in IAM policies to further restrict access
  catalogue_version: 0.1.0
  active_status: active
  source_status: available
- control_id: IAM-TRUST-003
  control_category: identity_and_permissions
  control_name: Constrain role trust policies
  control_description: A role's trust policy decides who can assume it; it should name explicit principals
    and add conditions for cross-account or external principals rather than trusting broadly.
  enforcement: recommended
  applicability_conditions:
    any:
    - fact: resource_kinds
      any_of:
      - trust_policy
    - fact: permission_shapes
      any_of:
      - trust_wildcard
    - all:
      - fact: resource_kinds
        any_of:
        - iam_role
      - fact: action_classes
        any_of:
        - create
    - all:
      - fact: exposure
        any_of:
        - cross_account
      - fact: services
        any_of:
        - iam
        - sts
  satisfied_by:
    fact: stated_requirements
    any_of:
    - restricted_trust
  affected_services_or_components:
  - iam
  - sts
  required_prompt_clause: For {subject}, list the exact principal(s) allowed to assume the role in its
    trust policy (no wildcard principal), add conditions for cross-account or external principals, and
    do not widen who can assume it beyond what the request names.
  verification_expectation: 'Read the trust policy: the Principal element names specific accounts, roles
    or services, never "*", and cross-account trust carries a condition. Report any principal the request
    did not name.'
  severity_or_priority: high
  required_context:
  - key: assuming_principal
    question: Which principal(s) (service, role or account) should be allowed to assume this role?
    why_it_matters: The trust policy must name who may assume the role, and nothing in the request says
      who that is.
    provided_when:
      fact: stated_requirements
      any_of:
      - restricted_trust
    blocking: false
  conflict_triggers:
  - id: wildcard-trust-principal-requested
    when:
      fact: requested_configurations
      any_of:
      - wildcard_trust_principal
    why: Trusting any principal to assume the role lets unintended identities obtain its permissions.
    alternative: Name the specific account, role or service that needs to assume the role and add conditions
      (for example an external ID for third parties).
  source_name: AWS IAM User Guide — Security best practices
  source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  source_version_or_section: IAM Access Analyzer and resource access review
  retrieved_at: '2026-10-21T04:45:00Z'
  content_hash: null
  provenance_status: section_checked
  derived: true
  supporting_references:
  - source_name: AWS IAM User Guide - Security best practices in IAM
    source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
    source_version_or_section: Apply least-privilege permissions
  catalogue_version: 0.1.0
  active_status: active
