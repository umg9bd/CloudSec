    source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
    source_version_or_section: Follow best practices to protect your root user
  catalogue_version: 0.1.0
  active_status: active
  source_status: available
- control_id: S3-PUBLIC-001
  control_category: storage_and_cloud_resources
  control_name: Avoid unintended public exposure of buckets
  control_description: Buckets should stay private unless public content is the explicit purpose, with
    Block Public Access on and access limited to named principals.
  enforcement: recommended
  applicability_conditions:
    all:
    - fact: services
      any_of:
      - s3
    - any:
      - fact: resource_actions
        any_of:
        - create_bucket
        - modify_bucket
      - fact: exposure
        any_of:
        - public_internet
        - public_principal
      - fact: requested_configurations
        any_of:
        - public_bucket_access
        - public_bucket_write
        - disable_public_access_block
  satisfied_by:
    fact: stated_requirements
    any_of:
    - block_public_access
