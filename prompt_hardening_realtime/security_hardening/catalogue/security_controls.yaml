    any_of:
    - no_hardcoded_secrets
  affected_services_or_components:
  - application
  - iac
  required_prompt_clause: Never hardcode credentials or secrets in source, configuration or prompts; read
    them at runtime from the project's existing secret-handling mechanism, and keep them out of logs,
    error messages and test output.
  verification_expectation: Scan the produced files and test output for credentials, keys and tokens;
    there must be none, and secrets must be read from the runtime environment or the project's existing
    secret mechanism.
  severity_or_priority: high
  conflict_triggers:
  - id: embed-credentials-requested
    enforcement: mandatory
    when:
      fact: requested_configurations
      any_of:
      - embed_credentials
    why: Credentials placed in source code or configuration files are exposed to everyone who can read
      the repository and to every copy of it.
    alternative: Load the credential at runtime from the project's existing secret-handling mechanism
      (environment injection or the approved secret store) and keep it out of version control.
