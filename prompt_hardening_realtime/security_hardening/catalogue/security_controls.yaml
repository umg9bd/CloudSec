  - only (return|show|allow|access|expose)[^.]{0,60}(own|owner|authori[sz]ed|permitted|entitled)
  - (authori[sz]ation|ownership|permission) checks?
  - (verify|check|ensure)\s+(that\s+)?(the\s+)?(caller|user|requester)\s+(owns|is authori[sz]ed|has access|may
    access)
  - tenant isolation
  ssrf_protection:
  - \bssrf\b
  - allow[- ]?list(ed)? (of )?(hosts?|domains?|urls?|schemes?)
  - (block|deny|reject)\w*\s+(private|internal|link[- ]local|metadata)
  - 169\.254\.169\.254
  path_restriction:
  - path traversal
  - (canonical|resolve|normali[sz])\w*\s+(the\s+)?paths?
  - (restrict|confine|limit)\w*\s+(to\s+)?(a |the )?(base|upload|specific|allowed)\s+(dir|directory|folder)
  - \b(basename|secure_filename)\b
  rate_limiting:
  - rate[- ]?limit(ing|ed)?
  - \brequest rates?\b
  - (cap|limit|restrict)\w*\s+(the\s+)?(request\s+)?rates?
  - throttl(e|ing|ed)
  - (max|maximum|limit)\w*\s+(the\s+)?(upload|file|request|payload|body)\s+size
  - (size|upload|request) limits?
  secure_error_handling:
  - (generic|sanitized|safe|non[- ]?revealing) error (message|response)s?
  - (no|don[\x27’]?t|do not|never|without)\s+(\w+\s+){0,3}(stack ?traces?|internal (errors?|details)|verbose
    errors?|sql errors?)
  - (hide|avoid leaking|not (leak|expose))\s+(internal|stack|error)
  no_sensitive_logging:
  - (redact|mask|scrub)\w*\s+(sensitive|secrets?|pii|tokens?|passwords?|personal)
  - (never|do not|don[\x27’]?t|no|avoid|without)\s+(\w+\s+){0,3}log(ging)?\s+(\w+\s+){0,3}(passwords?|secrets?|tokens?|credentials?|pii|sensitive|personal|parameters?|values?|inputs?)
  - no sensitive (data|values?) in logs?
  dependency_scanning:
  - (dependency|vulnerability)\s+(scan|check|audit)
  - \b(dependabot|pip[- ]audit|npm audit|snyk|trivy|safety)\b
  - pin(ned)?\s+(the\s+)?(versions?|dependencies)
  - \b(lockfile|sbom)\b
  - known[- ]vulnerab
  security_tests:
  - (security|negative|abuse|injection|authori[sz]ation|permission) tests?
  - (write|add|include)\w*\s+(unit |automated |integration )?tests?\s+(for|that|covering)[^.]{0,80}(inject|authori[sz]|permission|deny|denied|malicious|invalid|traversal|unauthori)
  - \b(sast|dast|bandit|semgrep|checkov|tfsec|cfn[- ]?nag)\b
  - policy (validation|linting|simulat)
  - iam access analyzer
  rollback_plan:
  - roll ?back
  - \brevert
  - backup before
  - reversible
  change_review:
  - (peer|code|security) review
  - (require|requires|needs?)\s+(\w+\s+){0,3}(approval|sign[- ]?off)
  - \b(change (request|control|ticket)|four[- ]eyes)\b
  - (terraform )?plan (output )?(review|first)|\bdry[- ]?run\b
  - permissions? boundar(y|ies)
  restricted_cidr:
  - (only|restricted to|limited to|allow(ed)? from)\s+(\w+\s+){0,3}(cidr|ip range|ip addresses?|office|vpn|corporate|trusted|known)
