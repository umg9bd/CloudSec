    uses a wildcard principal without a restricting condition, and no public ACL is set; report any intentional
    public content.
  severity_or_priority: high
  required_context:
  - key: bucket_audience
    question: Is any of this bucket's content meant to be public, or should it be private to named principals?
    why_it_matters: Public exposure of a bucket is a different configuration from private access.
    provided_when:
      any:
      - fact: stated_requirements
        any_of:
