- control_id: IAM-ESCALATE-004
  control_category: identity_and_permissions
  control_name: Prevent unintended permission expansion
  control_description: Rights to pass roles, create or attach policies, or edit trust policies let a principal
    grant itself or others more access than intended and should be tightly bounded and reviewed.
  enforcement: recommended
  applicability_conditions:
    fact: permission_shapes
    any_of:
    - passrole
    - iam_write
  satisfied_by:
    fact: stated_requirements
    any_of:
    - change_review
  affected_services_or_components:
  - iam
  - sts
  required_prompt_clause: 'Check that {subject} cannot be used to grant itself or others more access than
    intended: limit iam:PassRole to the specific roles needed, avoid unrestricted policy-creation and
    policy-attachment rights, and consider a permissions boundary for delegated administration.'
  verification_expectation: List every IAM write action and iam:PassRole grant in the result and confirm
    each is limited to named resources; confirm the principal cannot attach a more powerful policy to
    itself.
  severity_or_priority: high
  source_name: AWS IAM User Guide — Security best practices
  source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  source_version_or_section: Permissions boundaries and delegated permission management
  retrieved_at: '2026-10-21T04:45:00Z'
  content_hash: null
