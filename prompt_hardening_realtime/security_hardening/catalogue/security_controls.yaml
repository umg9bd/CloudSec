- control_id: IAM-CREDS-005
  control_category: identity_and_permissions
  control_name: Prefer temporary credentials; protect the root user
  control_description: Workloads should obtain temporary credentials through roles instead of long-term
    access keys, and the root user should not be used for routine tasks.
  enforcement: recommended
  applicability_conditions:
    any:
    - fact: credential_handling
      any_of:
      - create_access_key
      - long_term_credentials
      - use_root
    - fact: resource_kinds
      any_of:
      - access_key
    - fact: requested_configurations
      any_of:
      - use_root_credentials
  satisfied_by:
    fact: stated_requirements
    any_of:
    - temporary_credentials
  affected_services_or_components:
  - iam
  - sts
  required_prompt_clause: Use IAM roles with temporary credentials instead of long-term access keys for
    {subject}, and never use the root user for this task. If a long-term key is unavoidable, scope it
    tightly, plan its rotation, and keep it out of source code and logs.
  verification_expectation: Confirm no new long-term access key is created without a stated reason and
    rotation plan, and that no step runs as the root user.
  severity_or_priority: high
  conflict_triggers:
  - id: root-credentials-requested
    enforcement: mandatory
    when:
      fact: requested_configurations
      any_of:
      - use_root_credentials
    why: Routine use of the root user or root access keys is exactly what IAM guidance says to avoid.
    alternative: Use an IAM role (or a dedicated least-privilege IAM identity) with temporary credentials
      and reserve the root user for the few tasks that require it.
  source_name: AWS IAM User Guide — Security best practices
  source_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  source_version_or_section: Use temporary credentials and roles for workloads
  retrieved_at: '2026-10-21T04:45:00Z'
  content_hash: null
